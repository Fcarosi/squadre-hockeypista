name: Aggiorna dati FISR
on:
  schedule:
    - cron: '17 2 * * *'   # ogni notte verso le 3-4 ora italiana
  workflow_dispatch: {}     # pulsante "Run workflow" per aggiornare a mano
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/update.mjs
      - name: Salva i dati aggiornati
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Dati FISR aggiornati $(date +%d/%m/%Y)"
          git push
